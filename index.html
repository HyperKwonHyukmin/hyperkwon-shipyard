<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#002554" />
    <meta name="description" content="HD현대중공업 울산조선소를 무대로 배 한 척이 만들어지는 과정을 장소별로 둘러보는 비공식 개인 프로젝트" />
    <link rel="stylesheet" href="/fonts.css" />
    <title>HD현대중공업 울산조선소 이야기</title>
    <style>
      /* 공식 색상 체계(CI 페이지 공개 값). 화면(UI)에만 쓴다 */
      :root {
        --eco: #00e600; --heritage: #00ad1d; --prosperity: #008233; --discovery: #003087; --trust: #002554;
        --text: #e8edf5; --muted: #a9b6c8; --line: rgba(255, 255, 255, .14);
        --panel: rgba(0, 37, 84, .88);
      }
      html, body { margin: 0; height: 100%; background: #0a1120; overflow: hidden; }
      body { font-family: Pretendard, system-ui, sans-serif; color: var(--text); }
      #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      a { color: #8fc3ff; }
      button { font: inherit; }

      .hud { position: fixed; left: 16px; top: 14px; max-width: calc(100% - 240px); pointer-events: none;
        text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
      /* 낮: 밝은 하늘 위에서도 읽히게 HUD 뒤에 옅은 남색 판 */
      [data-time="day"] .hud { padding: 8px 12px; margin: -8px 0 0 -12px; border-radius: 12px; background: rgba(0, 37, 84, .55); }
      [data-time="day"] .hud p { color: #d5deeb; }
      .hud h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
      .hud h1::before { content: ""; display: inline-block; width: 9px; height: 9px; margin: 0 8px 3px 0;
        border-radius: 50%; background: var(--eco); }
      .hud p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
      .hud .station { color: var(--text); font-weight: 600; }

      .controls { position: fixed; right: 16px; top: 14px; display: flex; gap: 8px; }
      .btn { min-width: 52px; padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 13px; line-height: 1;
        color: var(--text); cursor: pointer; background: var(--panel); border: 1px solid var(--line); }
      .btn:hover { background: var(--discovery); }
      .btn[aria-pressed="true"] { border-color: var(--heritage); }
      .btn:disabled { opacity: .4; cursor: default; }
      .btn:focus-visible, .map g:focus-visible { outline: 2px solid var(--eco); outline-offset: 2px; }

      .panel { position: fixed; right: 16px; top: 62px; width: 340px; max-height: calc(100% - 150px); display: flex;
        flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        overflow: hidden; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
      .panel-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--discovery); }
      .panel-head .no { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
        background: var(--prosperity); font-weight: 800; font-size: 14px; }
      .panel-head h2 { flex: 1; margin: 0; font-size: 17px; }
      .panel-head .btn { padding: 6px 10px; min-width: 0; }
      .panel-body { padding: 12px 14px 14px; overflow: auto; font-size: 14px; line-height: 1.65; }
      .panel.collapsed .panel-body { display: none; }
      .proc { margin: 0 0 8px; font-size: 12.5px; color: var(--heritage); font-weight: 700; }
      .panel-body p { margin: 0 0 10px; }
      .panel-body h3 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
      .facts { margin: 0; padding-left: 18px; font-size: 13px; }
      .facts li { margin-bottom: 6px; }
      .facts a { font-size: 12px; white-space: nowrap; }

      .live { margin: 4px 0 10px; padding: 8px 10px; border-left: 3px solid var(--heritage); background: rgba(255,255,255,.05); font-size: 13px; }
      .bm-h { margin: 6px 0 4px; font-size: 12px; color: var(--heritage); font-weight: 700; }
      .bm .eras .btn { font-size: 12px; padding: 8px 6px; }
      .bm-chart { display: block; width: 100%; margin: 8px 0 2px; }
      .bm-figs { display: flex; gap: 10px; align-items: center; }
      .bm-sec { flex: 0 0 140px; }
      .bm svg text { fill: #c9d6e8; font-size: 12px; }
      .bm svg text.small { font-size: 11px; }
      .bm svg .axis { stroke: rgba(255,255,255,.35); stroke-width: 1; }
      .bm svg .na { stroke: rgba(255,255,255,.5); stroke-dasharray: 3 2; }
      .bm svg .hull { fill: none; stroke: #c9d6e8; stroke-width: 2; }
      #bm-curve { fill: rgba(0,173,29,.25); stroke: var(--heritage); stroke-width: 2; }
      #sec-dist { fill: rgba(233,237,241,.25); stroke: #e9edf1; stroke-width: 1; }
      .bm-legend { margin: 2px 0; font-size: 11px; line-height: 1.5; color: #c9d6e8; }
      .bm-legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 6px; vertical-align: -1px; }
      .bm-legend .t { background: #c0262d; } .bm-legend .c { background: #1f5fae; }
      .bm-warn { margin: 6px 0 0; padding: 6px 8px; border-left: 3px solid #e0b020; background: rgba(224,176,32,.12); font-size: 12px; }
      .lf { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); }
      .lf h3 { margin: 0 0 6px; font-size: 14px; }
      .lf-p { margin: 0 0 8px; font-size: 13px; }
      .lf #lf-focus { margin-bottom: 8px; }
      .lf-t { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0; }
      .lf-t th { text-align: left; font-weight: 500; color: #c9d6e8; padding: 3px 0; }
      .lf-t td { text-align: right; font-weight: 700; white-space: nowrap; padding: 3px 0 3px 8px; }
      .walk-hud { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; max-width: min(92vw, 720px); }
      .walk-hud[hidden] { display: none; }
      .walk-hud > * { pointer-events: auto; }
      .walk-keys { margin: 0; padding: 6px 12px; border-radius: 10px; background: rgba(0,37,84,.78); color: #dfe8f5; font-size: 12px; text-align: center; }
      .walk-keys .btn { padding: 4px 8px; min-width: 0; font-size: 12px; }
      #walk-look { padding: 12px 18px; font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
      .eras { display: flex; gap: 6px; margin: 0 0 10px; }
      .eras .btn { flex: 1; }
      .live span { color: var(--heritage); font-weight: 700; }
      .flow { margin: 0 0 10px; }
      .flow h3 { margin: 0 0 4px !important; }
      .flow button { display: flex; gap: 6px; width: 100%; margin: 3px 0; padding: 6px 8px; border-radius: 8px; text-align: left;
        color: var(--text); background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-size: 13px; cursor: pointer; }
      .flow button:hover { border-color: var(--heritage); }
      .flow button b { flex: none; color: var(--heritage); }
      .panel-body .primary { margin: 0 0 10px; background: var(--prosperity); border-color: transparent; }
      .panel-body .primary:hover { background: #006e2b; border-color: var(--heritage); }
      .tl { display: block; margin: 4px 0 2px; font-size: 13px; font-weight: 600; }
      .tl input { width: 100%; margin-top: 6px; accent-color: var(--heritage); }
      .tl-marks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

      .nav { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); display: flex; gap: 8px; }
      .nav .btn { padding: 10px 16px; font-size: 14px; }
      .nav .primary { background: var(--prosperity); border-color: transparent; }
      .nav .primary:hover { background: #006e2b; border-color: var(--heritage); }
      .disclaimer { position: fixed; left: 0; right: 0; bottom: 8px; margin: 0; text-align: center; font-size: 11.5px;
        color: #a3b0c2; pointer-events: none; padding: 0 16px; text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }

      .map { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(3, 8, 18, .6); }
      .map[hidden] { display: none; }
      .map-box { width: min(920px, 100%); max-height: 100%; overflow: auto; background: var(--panel);
        border: 1px solid var(--line); border-radius: 14px; }
      .map-box header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
        background: var(--discovery); }
      .map-box h2 { margin: 0; font-size: 16px; }
      #map-svg { display: block; width: 100%; height: auto; }
      .m-land { fill: #1d2632; } .m-sea { fill: #0b2747; } .m-road { fill: #2c323b; }
      .m-dock { fill: #0a1018; stroke: #c9b25a; stroke-width: 3; } .m-gate { fill: #5a3b33; } .m-pier { fill: #4a4f57; }
      .m-flow { fill: none; stroke: #e0a91c; stroke-width: 5; stroke-dasharray: 16 10; opacity: .85; }
      .m-arrow { fill: #e0a91c; }
      .m-st { cursor: pointer; } .m-st circle { fill: var(--trust); stroke: #8aa0bd; stroke-width: 4; }
      .m-st text { fill: #fff; font: 800 28px Pretendard, system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .m-st.seen circle { fill: var(--prosperity); stroke: var(--heritage); }
      .m-st.now circle { fill: var(--prosperity); stroke: var(--eco); stroke-width: 7; }
      .map-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; margin: 0;
        padding: 12px 14px 4px; list-style: none; }
      .map-list button { width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer;
        color: var(--text); background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-size: 13px; }
      .map-list button.seen { border-color: var(--prosperity); }
      .map-list button.now { background: var(--prosperity); }
      .map-hint { margin: 0; padding: 4px 14px 12px; font-size: 12px; color: var(--muted); }
      .error { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: #c9d3e0; }

      @media (max-width: 700px) {
        .hud { max-width: calc(100% - 24px); }
        .hud h1 { font-size: 16px; }
        .hud p { font-size: 12px; }
        .controls { top: auto; bottom: 84px; right: 8px; }
        .panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 130px; max-height: 42vh; }
        .nav { bottom: 30px; width: calc(100% - 16px); justify-content: center; }
        .nav .btn { padding: 10px 12px; flex: 1; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="울산조선소를 모티브로 한 3D 조선소 장면"></canvas>
    <header class="hud">
      <h1>HD현대중공업 울산조선소 이야기</h1>
      <p class="station" id="hud-station"></p>
      <p class="status" id="hud-status"></p>
    </header>
    <div class="controls">
      <button class="btn" id="time" type="button">밤으로</button>
      <button class="btn" id="sound" type="button" aria-pressed="false">소리 켜기</button>
      <button class="btn" id="speed" type="button" aria-label="진행 속도">×1</button>
      <button class="btn primary" id="walk" type="button" aria-pressed="false">걸어서 견학</button>
      <button class="btn" id="spin" type="button" aria-pressed="false" aria-label="화면 자동 회전">회전</button>
      <button class="btn" id="overview" type="button" aria-label="조선소 전체 보기">전체</button>
    </div>
    <div class="walk-hud" id="walk-hud" hidden></div>
    <aside class="panel" id="panel" aria-label="장소 설명">
      <div class="panel-head">
        <span class="no" id="p-no"></span>
        <h2 id="p-name"></h2>
        <button class="btn" id="p-toggle" type="button" aria-expanded="true">접기</button>
      </div>
      <div class="panel-body">
        <p class="proc" id="p-proc"></p>
        <p id="p-summary"></p>
        <div class="flow" id="p-flow"></div>
        <div id="p-extra"></div>
        <h3 id="p-facts-head">공개 기록</h3>
        <ul class="facts" id="p-facts"></ul>
      </div>
    </aside>
    <nav class="nav" aria-label="장소 이동">
      <button class="btn" id="prev" type="button">◀ 이전</button>
      <button class="btn" id="map-btn" type="button">지도 · 방문 <span id="visited">0</span>/<span id="visited-total">11</span></button>
      <button class="btn primary" id="next" type="button">다음 ▶</button>
    </nav>
    <div class="map" id="map" hidden>
      <div class="map-box" role="dialog" aria-label="조선소 지도">
        <header><h2>조선소 지도</h2><button class="btn" id="map-close" type="button">닫기</button></header>
        <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <ol class="map-list" id="map-list"></ol>
        <p class="map-hint">배치는 공정 순서대로 둘러보기 좋게 줄인 것으로, 실제 조선소 배치와 다릅니다. 화면을 끌면 돌고, 오른쪽 단추로 끌면 땅을 따라 옮겨지고, 휠은 마우스가 가리키는 곳으로 확대합니다. 두 번 누르면 그곳이 회전 중심이 됩니다. ←/→ 키로도 이동합니다.</p>
      </div>
    </div>
    <p class="disclaimer">HD현대중공업과 관계없는 비공식 개인 프로젝트입니다. 공개 자료를 바탕으로 했습니다.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
